<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Follow the Bats</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #020c45;
      --cream: #f8f5ed;
      --text: #f8f5ed;
      --muted: #c6cfda;
      --border: rgba(248, 245, 237, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: var(--navy);
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
    }

    .terminal {
      width: 100%;
      max-width: 460px;
      padding: 42px 38px 48px;
      text-align: center;
    }

    .bat-image {
      width: 250px;
      height: 250px;
      object-fit: contain;
      margin: 0 auto 28px;
      display: block;
    }

    .subtitle {
      font-size: 11px;
      line-height: 1.9;
      letter-spacing: 1.5px;
      color: var(--muted);
      margin: 0 0 30px;
      text-transform: uppercase;
    }

    input,
    button {
      width: 100%;
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      letter-spacing: 1px;
      padding: 15px 16px;
      margin-top: 10px;
      transition: all 0.25s ease;
    }

    input {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      outline: none;
      text-align: center;
    }

    input::placeholder {
      color: #9eacbd;
    }

    input:focus {
      border-color: var(--cream);
    }

    button {
      background: var(--cream);
      color: var(--navy);
      border: 1px solid var(--cream);
      cursor: pointer;
      text-transform: uppercase;
      font-weight: 600;
    }

    button:hover {
      background: transparent;
      color: var(--cream);
    }

    #warning {
      display: none;
      margin-top: 12px;
      font-size: 11px;
      color: var(--cream);
    }

    #result {
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid var(--border);
      display: none;
      font-size: 12px;
      line-height: 1.8;
    }

    #result p {
      margin: 6px 0;
    }

    /* The code image */
    .code-image {
      display: block;
      width: 100%;
      max-width: 300px;
      height: auto;
      margin: 16px auto 0;
    }
  </style>
</head>

<body>

  <div class="terminal">

    <img src="bat.png" alt="Bat" class="bat-image">

    <p class="subtitle">
      Please enter the seven letter password
    </p>

    <input
      type="text"
      id="password"
      maxlength="7"
      placeholder=""
      oninput="checkLength()"
      onkeydown="if(event.key === 'Enter') checkPassword()"
    >

    <div id="warning">
      Password too long
    </div>

    <button onclick="checkPassword()">Enter</button>

    <div id="result"></div>

  </div>

  <script>
    function checkLength() {
      const password = document.getElementById("password");
      const warning = document.getElementById("warning");

      if (password.value.length > 7) {
        warning.style.display = "block";
      } else {
        warning.style.display = "none";
      }
    }

    function checkPassword() {
      const password = document.getElementById("password").value;
      const result = document.getElementById("result");

      if (password.length > 7) {
        result.style.display = "none";
        return;
      }

      if (password.toLowerCase() === "eclipse") {
        result.innerHTML = `
          <p>Congratulations, you solved the puzzle!</p>
          <p>Now open the box:</p>
          <img src="code.png" alt="Code" class="code-image">
        `;
      } else {
        result.innerHTML = `
          <p>Sorry, not this time.</p>
          <p>Please try again.</p>
        `;
      }

      result.style.display = "block";
    }
  </script>

</body>
</html>
